<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 481" width="856" height="481" style="background-color: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="arch-bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#141c2e" />
      <stop offset="100%" stop-color="#070a12" />
    </radialGradient>

    <!-- Zone Gradients -->
    <linearGradient id="zone-internet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f0715" />
    </linearGradient>

    <linearGradient id="zone-lab" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#040d1a" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6" />
    </marker>

    <!-- Grid Pattern -->
    <pattern id="grid-net" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.2" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="856" height="481" fill="url(#arch-bg)" />
  <rect width="856" height="481" fill="url(#grid-net)" />

  <!-- ==================== ZONE 1: PUBLIC INTERNET & THREATS (LEFT) ==================== -->
  <g transform="translate(35, 45)">
    <rect x="0" y="0" width="220" height="375" rx="12" fill="url(#zone-internet)" stroke="#4c1d95" stroke-width="2.5" />
    
    <text x="25" y="35" font-size="12" font-weight="800" fill="#a78bfa" letter-spacing="1">PUBLIC INTERNET</text>
    
    <!-- Threat Icons / Boxes -->
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="180" height="60" rx="6" fill="#120b24" stroke="#7c3aed" stroke-width="1.5" />
      <text x="15" y="25" font-size="11" font-weight="700" fill="#f43f5e">⚠️ Port Scanning</text>
      <text x="15" y="42" font-size="10" fill="#94a3b8">External direct probes</text>
    </g>

    <g transform="translate(20, 135)">
      <rect x="0" y="0" width="180" height="60" rx="6" fill="#120b24" stroke="#7c3aed" stroke-width="1.5" />
      <text x="15" y="25" font-size="11" font-weight="700" fill="#f43f5e">⚠️ Perimeter Attacks</text>
      <text x="15" y="42" font-size="10" fill="#94a3b8">Vulnerability exploits</text>
    </g>

    <!-- Blocked Arrow -->
    <path d="M 110 215 L 110 270" stroke="#ef4444" stroke-width="3" stroke-dasharray="4,4" marker-end="url(#arrow-red)" />
    
    <rect x="50" y="285" width="120" height="45" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="2" />
    <text x="110" y="305" font-size="11" font-weight="800" fill="#fca5a5" text-anchor="middle">BLOCKED</text>
    <text x="110" y="320" font-size="9" fill="#fca5a5" text-anchor="middle">Zero Public IP</text>
  </g>

  <!-- ==================== ZONE 2: ZERO-TRUST LAB CORE (MIDDLE) ==================== -->
  <g transform="translate(285, 45)">
    <rect x="0" y="0" width="290" height="375" rx="12" fill="url(#zone-lab)" stroke="#0ea5e9" stroke-width="3" />
    
    <rect x="25" y="20" width="140" height="26" rx="4" fill="#0369a1" />
    <text x="95" y="37" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">LAB SCOPE CORE</text>

    <!-- Lab Components -->
    <g transform="translate(25, 65)">
      <rect x="0" y="0" width="240" height="75" rx="8" fill="#070a12" stroke="#38bdf8" stroke-width="2" />
      <text x="15" y="28" font-size="13" font-weight="700" fill="#38bdf8">🛡️ Tailscale ZTNA Mesh</text>
      <text x="15" y="48" font-size="10" fill="#94a3b8">Encrypted peer-to-peer tunnels</text>
      <text x="15" y="62" font-size="10" fill="#94a3b8">Strict identity-based access</text>
    </g>

    <g transform="translate(25, 155)">
      <rect x="0" y="0" width="240" height="75" rx="8" fill="#070a12" stroke="#38bdf8" stroke-width="2" />
      <text x="15" y="28" font-size="13" font-weight="700" fill="#34d399">⚙️ Terraform &amp; Ansible</text>
      <text x="15" y="48" font-size="10" fill="#94a3b8">Declarative automation workflows</text>
      <text x="15" y="62" font-size="10" fill="#94a3b8">Keyless GitHub OIDC deployment</text>
    </g>

    <!-- Internal Threat Warning Box inside Lab -->
    <g transform="translate(25, 245)">
      <rect x="0" y="0" width="240" height="105" rx="8" fill="#1c1917" stroke="#f59e0b" stroke-width="2" />
      <text x="15" y="25" font-size="12" font-weight="800" fill="#fbbf24">⚠️ INTERNAL THREAT MODEL</text>
      <text x="15" y="48" font-size="10" fill="#fde68a">• App &amp; OS vulnerabilities</text>
      <text x="15" y="68" font-size="10" fill="#fde68a">• Memory leaks &amp; misconfigs</text>
      <text x="15" y="88" font-size="10" fill="#fde68a">• Privilege escalation risks</text>
    </g>
  </g>

  <!-- ==================== ZONE 3: DEFERRED ENTERPRISE FEATURES (RIGHT) ==================== -->
  <g transform="translate(605, 45)">
    <rect x="0" y="0" width="220" height="375" rx="12" fill="#090d16" stroke="#334155" stroke-width="2" />
    
    <text x="20" y="35" font-size="11" font-weight="800" fill="#94a3b8" letter-spacing="1">DEFERRED FEATURES</text>
    
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="180" height="65" rx="6" fill="#070a12" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,3" />
      <text x="15" y="25" font-size="11" font-weight="700" fill="#cbd5e1">☁️ Multi-Region HA</text>
      <text x="15" y="45" font-size="10" fill="#64748b">Intentionally deferred</text>
    </g>

    <g transform="translate(20, 140)">
      <rect x="0" y="0" width="180" height="65" rx="6" fill="#070a12" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,3" />
      <text x="15" y="25" font-size="11" font-weight="700" fill="#cbd5e1">💾 Auto Backup/Restore</text>
      <text x="15" y="45" font-size="10" fill="#64748b">Requires enterprise tuning</text>
    </g>

    <g transform="translate(20, 220)">
      <rect x="0" y="0" width="180" height="65" rx="6" fill="#070a12" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,3" />
      <text x="15" y="25" font-size="11" font-weight="700" fill="#cbd5e1">📊 Centralized SIEM</text>
      <text x="15" y="45" font-size="10" fill="#64748b">Out of lightweight lab scope</text>
    </g>

    <text x="20" y="315" font-size="10" fill="#64748b" font-style="italic">Needs hardening for production</text>
  </g>

  <!-- ==================== CONNECTING LINE ==================== -->
  <path d="M 255 232 L 285 232" stroke="#0ea5e9" stroke-width="3" stroke-dasharray="4,4" marker-end="url(#arrow-blue)" />
  <path d="M 575 232 L 605 232" stroke="#475569" stroke-width="2" stroke-dasharray="3,3" />

  <!-- FOOTER BANNER -->
  <g transform="translate(35, 435)">
    <rect x="0" y="0" width="790" height="28" rx="6" fill="#111827" stroke="#334155" stroke-width="1.2" />
    <text x="15" y="18" font-size="10" font-weight="700" fill="#38bdf8">🛡️ SECURITY &amp; BOUNDARY TOPOLOGY:</text>
    <text x="215" y="18" font-size="10" fill="#94a3b8">External Scanning Blocked • Zero Public IP Core • Internal Application Risks Highlighted</text>
    <text x="745" y="18" font-size="10" font-weight="800" fill="#38bdf8">netop.uk</text>
  </g>
</svg>