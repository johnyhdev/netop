#https://www.hugolify.io/docs/customization/menu/
header:
  layout: offcanvas
  offcanvas:
    position: end # default, or start, top, bottom

    $navbar-expand: lg // false to disable

css:
  preload: true   # adds <link rel="preload"> for performance

  logo:
    header: '/assets/images/logo.svg'
    #footer: '/assets/images/logo-footer.svg' # default: /assets/images/logo.svg

  #dimension
hero:
  cover: '1600x800'
  cover_mobile: '360x200'

image:
  retina:
    desktop: false # default false, Set true to enable retina for desktop

  xlarge: '1600x'
  desktop: '856x481'
  mobile: '360x200'

thumbnail:
  desktop: '416x234'
  desktop_large: '636x358'
  mobile: '300x169'
  scrollsnap: '240x103'

pages:
  thumbnail:
    desktop: '416x234'
    desktop_large: '636x358'
    mobile: '300x169'
    scrollsnap: '240x103'
  image:
    desktop: '856x481'
    mobile: '360x200'
posts:
  thumbnail:
    desktop: '416x234'
    desktop_large: '636x358'
    mobile: '300x169'
    scrollsnap: '240x103'
  image:
    desktop: '856x481'
    mobile: '360x200'
casestudies:
  thumbnail:
    desktop: '416x234'
    desktop_large: '636x358'
    mobile: '300x169'
    scrollsnap: '240x103'
  image:
    desktop: '856x481'
    mobile: '360x200'
