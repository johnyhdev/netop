<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 481" width="856" height="481" style="background-color: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="netdevops-bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#141c2e" />
      <stop offset="100%" stop-color="#070a12" />
    </radialGradient>

    <!-- Card Gradients -->
    <linearGradient id="card-git" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="card-multi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#040d1a" />
    </linearGradient>

    <linearGradient id="card-tailscale" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a855f7" />
    </marker>

    <!-- Grid Pattern -->
    <pattern id="net-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.2" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="856" height="481" fill="url(#netdevops-bg)" />
  <rect width="856" height="481" fill="url(#net-grid)" />

  <!-- ==================== PILLAR 1: DECLARATIVE (LEFT) ==================== -->
  <g transform="translate(35, 45)">
    <rect x="0" y="0" width="240" height="375" rx="14" fill="url(#card-git)" stroke="#3b82f6" stroke-width="3" />
    
    <!-- Badge -->
    <rect x="15" y="16" width="210" height="32" rx="6" fill="#1d4ed8" />
    <text x="120" y="37" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">GITOPS GOVERNANCE</text>

    <!-- Code Preview Box -->
    <g transform="translate(15, 60)">
      <rect x="0" y="0" width="210" height="135" rx="8" fill="#070a12" stroke="#60a5fa" stroke-width="2" />
      <text x="15" y="25" font-size="11" font-weight="700" fill="#60a5fa">terraform apply</text>
      <text x="15" y="48" font-size="10" fill="#94a3b8"># Zero Manual Tweaks</text>
      <text x="15" y="72" font-size="10" fill="#34d399">resource "azurerm_vnet" {</text>
      <text x="25" y="92" font-size="10" fill="#34d399">cidr = "10.20.0.0/16"</text>
      <text x="15" y="112" font-size="10" fill="#34d399">}</text>
    </g>

    <!-- Bullet Points -->
    <g transform="translate(15, 208)">
      <text x="0" y="0" font-size="11" font-weight="700" fill="#38bdf8">✔ Pull Request Checks</text>
      <text x="0" y="24" font-size="11" font-weight="700" fill="#38bdf8">✔ Drift Control</text>
      <text x="0" y="48" font-size="11" font-weight="700" fill="#38bdf8">✔ Keyless OIDC Auth</text>
    </g>
  </g>

  <!-- ==================== PILLAR 2: MULTI-SITE (MIDDLE) ==================== -->
  <g transform="translate(295, 45)">
    <rect x="0" y="0" width="265" height="375" rx="14" fill="url(#card-multi)" stroke="#0ea5e9" stroke-width="3" />
    
    <!-- Badge -->
    <rect x="20" y="16" width="225" height="32" rx="6" fill="#0369a1" />
    <text x="132" y="37" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">MULTI-SITE ISOLATION</text>

    <!-- Center Highlights -->
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="225" height="110" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
      <text x="15" y="28" font-size="12" font-weight="800" fill="#7dd3fc">🛡️ Strict Isolation</text>
      <text x="15" y="52" font-size="10" fill="#cbd5e1">• Zero public IP exposure</text>
      <text x="15" y="70" font-size="10" fill="#cbd5e1">across branch sites</text>
      <text x="15" y="92" font-size="10" fill="#cbd5e1">• Automated policy compliance</text>
    </g>

    <g transform="translate(20, 182)">
      <rect x="0" y="0" width="225" height="60" rx="6" fill="#090d16" stroke="#0284c7" stroke-width="1.5" />
      <text x="15" y="22" font-size="11" font-weight="700" fill="#38bdf8">Repeatable Blueprints</text>
      <text x="15" y="42" font-size="10" fill="#94a3b8">HCL &amp; Ansible automated setup</text>
    </g>
  </g>

  <!-- ==================== PILLAR 3: TAILSCALE MESH (RIGHT) ==================== -->
  <g transform="translate(580, 45)">
    <rect x="0" y="0" width="240" height="375" rx="14" fill="url(#card-tailscale)" stroke="#a855f7" stroke-width="3" />
    
    <!-- Badge -->
    <rect x="15" y="16" width="210" height="32" rx="6" fill="#6b21a8" />
    <text x="120" y="37" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">REMOTE MANAGEMENT</text>

    <!-- Visual Box -->
    <g transform="translate(15, 60)">
      <rect x="0" y="0" width="210" height="135" rx="8" fill="#120b24" stroke="#c084fc" stroke-width="2" />
      <circle cx="65" cy="65" r="12" fill="#7c3aed" />
      <circle cx="145" cy="65" r="12" fill="#3b82f6" />
      <path d="M 81 65 L 129 65" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="3,3" />
      <text x="105" y="110" font-size="10" font-weight="750" fill="#e9d5ff" text-anchor="middle">ENCRYPTED TAILNET</text>
    </g>

    <!-- Bullet Points -->
    <g transform="translate(15, 208)">
      <text x="0" y="0" font-size="11" font-weight="700" fill="#e9d5ff">✔ Direct Peer-to-Peer Tunnels</text>
      <text x="0" y="24" font-size="11" font-weight="700" fill="#e9d5ff">✔ No Port Forwarding</text>
      <text x="0" y="48" font-size="11" font-weight="700" fill="#e9d5ff">✔ Tailscale SSH &amp; ACLs</text>
    </g>
  </g>

  <!-- ==================== CONNECTING ARROWS ==================== -->
  <path d="M 275 230 L 295 230" stroke="#3b82f6" stroke-width="4" stroke-dasharray="6,4" marker-end="url(#arrow-blue)" />
  <path d="M 560 230 L 580 230" stroke="#a855f7" stroke-width="4" stroke-dasharray="6,4" marker-end="url(#arrow-purple)" />

  <!-- FOOTER BANNER -->
  <g transform="translate(35, 435)">
    <rect x="0" y="0" width="785" height="28" rx="6" fill="#111827" stroke="#334155" stroke-width="1.2" />
    <text x="15" y="18" font-size="10" font-weight="700" fill="#38bdf8">⚡ NETDEVOPS DOCTRINE:</text>
    <text x="155" y="18" font-size="10" fill="#94a3b8">Strict Security Isolation • Declarative Governance • Seamless Remote Access via Tailscale</text>
    <text x="740" y="18" font-size="10" font-weight="800" fill="#38bdf8">netop.uk</text>
  </g>
</svg>