<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Glow Filter for Screen & Accents -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Screen Glow Gradient -->
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Metallic Desk Base -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Grid in Background -->
  <g opacity="0.05" stroke="#38bdf8" stroke-width="1">
    <path d="M 0,100 L 800,100 M 0,200 L 800,200 M 0,300 L 800,300 M 0,400 L 800,400 M 0,500 L 800,500" />
    <path d="M 100,0 L 100,600 M 200,0 L 200,600 M 300,0 L 300,600 M 400,0 L 400,600 M 500,0 L 500,600 M 600,0 L 600,600 M 700,0 L 700,600" />
  </g>

  <!-- DESK & MONITOR MOUNT -->
  <path d="M 50,530 L 750,530 L 700,600 L 100,600 Z" fill="url(#deskGrad)" stroke="#64748b" stroke-width="1" />
  <!-- Dual Monitor Mount Arms -->
  <rect x="390" y="320" width="20" height="150" fill="#334155" rx="4" />
  <path d="M 230,360 L 390,380 L 570,360" stroke="#475569" stroke-width="8" stroke-linecap="round" fill="none" />

  <!-- LEFT MONITOR (CI/CD Pipelines & Terraform / Ansible Logs) -->
  <g transform="translate(70, 140)">
    <!-- Monitor Outer Frame -->
    <rect width="320" height="220" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#glow)" />
    <!-- Screen Inner Display -->
    <rect x="8" y="8" width="304" height="204" rx="4" fill="#030712" />
    <rect x="8" y="8" width="304" height="204" rx="4" fill="url(#screenGlow)" />

    <!-- IDE Header / Tabs -->
    <rect x="8" y="8" width="304" height="20" fill="#1e293b" />
    <circle cx="20" cy="18" r="3" fill="#ef4444" />
    <circle cx="30" cy="18" r="3" fill="#f59e0b" />
    <circle cx="40" cy="18" r="3" fill="#22c55e" />
    <text x="55" y="22" fill="#94a3b8" font-family="monospace" font-size="9">main.tf — GitHub Actions (OIDC Deploy)</text>

    <!-- CI/CD Pipeline Steps Visualizer -->
    <!-- Pipeline Node 1: Checkout -->
    <rect x="20" y="40" width="80" height="28" rx="4" fill="#1e293b" stroke="#22c55e" stroke-width="1.5" />
    <text x="30" y="57" fill="#f8fafc" font-family="monospace" font-size="9">✓ Checkout</text>
    <line x1="100" y1="54" x2="120" y2="54" stroke="#22c55e" stroke-width="2" />

    <!-- Pipeline Node 2: Terraform Plan -->
    <rect x="120" y="40" width="80" height="28" rx="4" fill="#1e293b" stroke="#22c55e" stroke-width="1.5" />
    <text x="128" y="57" fill="#f8fafc" font-family="monospace" font-size="9">✓ TF Plan</text>
    <line x1="200" y1="54" x2="220" y2="54" stroke="#00f2fe" stroke-width="2" />

    <!-- Pipeline Node 3: Ansible Playbook -->
    <rect x="220" y="40" width="80" height="28" rx="4" fill="#0284c7" stroke="#00f2fe" stroke-width="1.5" />
    <text x="226" y="57" fill="#ffffff" font-family="monospace" font-size="9">⟳ Ansible...</text>

    <!-- Execution Terminal Console -->
    <rect x="20" y="80" width="280" height="118" rx="4" fill="#090d16" stroke="#1e293b" />
    <text x="28" y="98" fill="#38bdf8" font-family="monospace" font-size="9">$ terraform apply -auto-approve</text>
    <text x="28" y="112" fill="#22c55e" font-family="monospace" font-size="8">azure_vm.gateway: Creating... [0s elapsed]</text>
    <text x="28" y="124" fill="#22c55e" font-family="monospace" font-size="8">azure_vm.gateway: Creation complete after 12s</text>
    <text x="28" y="138" fill="#38bdf8" font-family="monospace" font-size="9">$ ansible-playbook -i inventory site.yml</text>
    <text x="28" y="152" fill="#f8fafc" font-family="monospace" font-size="8">PLAY [Configure Zero-Trust Mesh &amp; FortiGate NGFW]</text>
    <text x="28" y="166" fill="#00f2fe" font-family="monospace" font-size="8">TASK [tailscale : Authenticate via OIDC token] OK</text>
    <text x="28" y="180" fill="#22c55e" font-family="monospace" font-size="8">PLAY RECAP: ok=12 changed=4 unreachable=0 failed=0</text>
  </g>

  <!-- RIGHT MONITOR (Network Architecture Topology & Zero Trust Routing) -->
  <g transform="translate(410, 140)">
    <!-- Monitor Outer Frame -->
    <rect width="320" height="220" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#glow)" />
    <!-- Screen Inner Display -->
    <rect x="8" y="8" width="304" height="204" rx="4" fill="#030712" />
    <rect x="8" y="8" width="304" height="204" rx="4" fill="url(#screenGlow)" />

    <!-- Dashboard Header -->
    <rect x="8" y="8" width="304" height="20" fill="#1e293b" />
    <text x="20" y="22" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="600">EVE-NG LAB ARCHITECTURE — ZERO TRUST MESH</text>

    <!-- Network Topology Nodes -->
    <!-- Cloud / Azure Node -->
    <g transform="translate(160, 50)">
      <rect x="-35" y="-12" width="70" height="24" rx="12" fill="#1e293b" stroke="#00f2fe" stroke-width="1.5" />
      <text x="0" y="4" text-anchor="middle" fill="#00f2fe" font-family="sans-serif" font-size="8" font-weight="bold">Azure Cloud</text>
    </g>

    <!-- FortiGate NGFW Core -->
    <g transform="translate(160, 110)">
      <circle r="18" fill="#0f172a" stroke="#ef4444" stroke-width="2" />
      <text x="0" y="3" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="8" font-weight="bold">FortiGate</text>
    </g>

    <!-- MikroTik Branch Left -->
    <g transform="translate(70, 165)">
      <rect x="-28" y="-12" width="56" height="24" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <text x="0" y="4" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="8">MikroTik</text>
    </g>

    <!-- Tailscale Mesh Node Right -->
    <g transform="translate(250, 165)">
      <rect x="-32" y="-12" width="64" height="24" rx="4" fill="#1e293b" stroke="#22c55e" stroke-width="1.5" />
      <text x="0" y="4" text-anchor="middle" fill="#22c55e" font-family="sans-serif" font-size="8">Tailscale SSH</text>
    </g>

    <!-- Topology Connection Lines -->
    <path d="M 160 62 L 160 92" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="3,3" />
    <path d="M 144 118 L 96 155" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M 176 118 L 220 155" stroke="#22c55e" stroke-width="1.5" />

    <!-- Live Telemetry / Traffic Metrics Overlay -->
    <rect x="20" y="170" width="80" height="30" rx="3" fill="#0f172a" opacity="0.8" stroke="#334155" />
    <text x="25" y="183" fill="#94a3b8" font-family="sans-serif" font-size="7">SLA UPTIME</text>
    <text x="25" y="194" fill="#22c55e" font-family="sans-serif" font-size="9" font-weight="bold">99.99%</text>

    <rect x="220" y="170" width="80" height="30" rx="3" fill="#0f172a" opacity="0.8" stroke="#334155" />
    <text x="225" y="183" fill="#94a3b8" font-family="sans-serif" font-size="7">LATENCY</text>
    <text x="225" y="194" fill="#00f2fe" font-family="sans-serif" font-size="9" font-weight="bold">12 ms</text>
  </g>

  <!-- SENIOR INFRASTRUCTURE ENGINEER (VECTOR CHARACTER - BACK / THREE-QUARTER VIEW) -->
  <g transform="translate(340, 310)">
    <!-- Engineer Head & Glasses Accent -->
    <circle cx="60" cy="50" r="28" fill="#334155" /> <!-- Hair / Head Base -->
    <path d="M 38 48 C 38 30, 82 30, 82 48 C 82 42, 70 34, 60 34 C 50 34, 38 42, 38 48 Z" fill="#1e293b" /> <!-- Short Hair Texture -->
    
    <!-- Ear & Glasses Frame Line -->
    <circle cx="82" cy="52" r="5" fill="#475569" />
    <path d="M 72 48 L 86 46" stroke="#00f2fe" stroke-width="2" /> <!-- Glowing Glasses Rim Edge -->

    <!-- Neck & Shirt Collar -->
    <path d="M 52 75 L 68 75 L 72 90 L 48 90 Z" fill="#64748b" />
    
    <!-- Dark Slate Technical Polo Shirt / Upper Body -->
    <path d="M 20 120 C 20 95, 45 90, 60 90 C 75 90, 100 95, 100 120 L 110 200 L 10 200 Z" fill="#1e293b" />
    
    <!-- Shoulder Seam & Clean Lines -->
    <path d="M 32 98 L 15 150" stroke="#334155" stroke-width="2" />
    <path d="M 88 98 L 105 150" stroke="#334155" stroke-width="2" />

    <!-- Left Arm & Hand on Desk (Typing / Operating Workstation) -->
    <path d="M 15 150 L -10 190 L 10 200" stroke="#1e293b" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
    <ellipse cx="-15" cy="195" rx="10" ry="6" fill="#475569" />

    <!-- Right Arm & Mouse Hand -->
    <path d="M 105 150 L 130 190 L 115 200" stroke="#1e293b" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
    <ellipse cx="130" cy="198" rx="10" ry="6" fill="#475569" />
  </g>

  <!-- PERIPHERALS ON DESK -->
  <!-- Mechanical Keyboard -->
  <rect x="310" y="500" width="130" height="22" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <!-- RGB Underglow Accent Line -->
  <line x1="315" y1="520" x2="435" y2="520" stroke="#00f2fe" stroke-width="2" filter="url(#glow)" />

  <!-- Ergonomic Precision Mouse -->
  <ellipse cx="480" cy="510" rx="12" ry="18" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
  <line x1="480" y1="494" x2="480" y2="504" stroke="#00f2fe" stroke-width="1.5" />

  <!-- Coffee Mug / Tech Essential -->
  <rect x="250" y="495" width="22" height="26" rx="3" fill="#334155" />
  <path d="M 250 500 C 242 500, 242 516, 250 516" stroke="#334155" stroke-width="3" fill="none" />
  <!-- Steam Vector Accent -->
  <path d="M 258 490 C 256 484, 262 480, 260 475" stroke="#94a3b8" stroke-width="1.5" fill="none" opacity="0.5" />
</svg>