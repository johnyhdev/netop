<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 481" width="856" height="481" style="background-color: #070D1B;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070D1B" />
      <stop offset="100%" stop-color="#111B2E" />
    </linearGradient>

    <!-- Legacy Red/Danger Gradient -->
    <linearGradient id="legacyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1215" />
      <stop offset="100%" stop-color="#1A0A0C" />
    </linearGradient>

    <!-- Modern Cyan/Secure Gradient -->
    <linearGradient id="modernGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2B3C" />
      <stop offset="100%" stop-color="#0B1626" />
    </linearGradient>

    <!-- Glow Effects -->
    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="856" height="481" fill="url(#bgGrad)" />
  <rect width="856" height="481" fill="url(#grid)" />

  <!-- ==================== SPLIT SCREEN CONTAINERS ==================== -->
  
  <!-- LEFT SIDE: LEGACY MODEL (Red Alert Theme) -->
  <g transform="translate(25, 30)">
    <!-- Box Background -->
    <rect x="0" y="0" width="395" height="421" rx="14" fill="url(#legacyGrad)" stroke="#EF4444" stroke-width="1.5" stroke-opacity="0.6" />
    
    <!-- Header Title -->
    <rect x="20" y="20" width="355" height="35" rx="6" fill="#EF4444" fill-opacity="0.15" stroke="#EF4444" stroke-width="1" />
    <text x="197" y="43" text-anchor="middle" fill="#FCA5A5" font-family="system-ui, sans-serif" font-weight="800" font-size="13" letter-spacing="0.5">LEGACY: PUBLIC IP EXPOSURE</text>

    <!-- Branch Office Object -->
    <g transform="translate(70, 130)">
      <rect x="-45" y="-35" width="90" height="70" rx="8" fill="#1A0A0C" stroke="#EF4444" stroke-width="2" />
      <circle cx="0" cy="-10" r="12" fill="#EF4444" fill-opacity="0.2" />
      <path d="M -6 -6 L 0 -18 L 6 -6 Z" fill="#EF4444" />
      <text x="0" y="22" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="700" font-size="11">Branch</text>
    </g>

    <!-- Cloud Server Object -->
    <g transform="translate(325, 130)">
      <rect x="-45" y="-35" width="90" height="70" rx="8" fill="#1A0A0C" stroke="#EF4444" stroke-width="2" />
      <path d="M -15 -6 C -21 -6 -25 -11 -25 -16 C -25 -21 -21 -25 -15 -25 C -14 -25 -13 -25 -11 -24 C -9 -29 -4 -32 2 -30 C 8 -28 11 -23 11 -18 C 15 -18 18 -15 18 -11 C 18 -6 15 -3 11 -3 Z" fill="#EF4444" opacity="0.8" transform="translate(0, 5) scale(1.1)" />
      <text x="0" y="22" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="700" font-size="11">Cloud Server</text>
    </g>

    <!-- Unsecure Direct Connection -->
    <path d="M 115 130 L 280 130" stroke="#EF4444" stroke-width="3" stroke-dasharray="6 4" fill="none" filter="url(#redGlow)" />
    
    <!-- Warning Icon -->
    <g transform="translate(197, 130)">
      <circle cx="0" cy="0" r="20" fill="#1A0A0C" stroke="#EF4444" stroke-width="2" />
      <text x="0" y="6" text-anchor="middle" fill="#EF4444" font-family="system-ui, sans-serif" font-weight="900" font-size="20">!</text>
    </g>

    <!-- Key Pain Points (Text List) -->
    <g transform="translate(25, 200)">
      <circle cx="12" cy="12" r="5" fill="#EF4444" />
      <text x="28" y="16" fill="#F3F4F6" font-family="system-ui, sans-serif" font-weight="700" font-size="11">High Risk of DDoS &amp; Bruteforce Attacks</text>
      
      <circle cx="12" cy="48" r="5" fill="#EF4444" />
      <text x="28" y="52" fill="#F3F4F6" font-family="system-ui, sans-serif" font-weight="700" font-size="11">Unencrypted Traffic over Public Internet</text>

      <circle cx="12" cy="84" r="5" fill="#EF4444" />
      <text x="28" y="88" fill="#F3F4F6" font-family="system-ui, sans-serif" font-weight="700" font-size="11">Complex Firewall Port Forwarding Rules</text>
    </g>

    <!-- Bottom Status Badge -->
    <rect x="25" y="355" width="345" height="36" rx="6" fill="#EF4444" fill-opacity="0.1" stroke="#EF4444" stroke-width="1" />
    <text x="197" y="378" text-anchor="middle" fill="#FCA5A5" font-family="system-ui, sans-serif" font-weight="800" font-size="11" letter-spacing="0.5">STATUS: INSECURE &amp; EXPOSED</text>
  </g>


  <!-- RIGHT SIDE: MODERN ZERO-TRUST MODEL (Cyan Secure Theme) -->
  <g transform="translate(436, 30)">
    <!-- Box Background -->
    <rect x="0" y="0" width="395" height="421" rx="14" fill="url(#modernGrad)" stroke="#00F2FE" stroke-width="1.5" stroke-opacity="0.6" />
    
    <!-- Header Title -->
    <rect x="20" y="20" width="355" height="35" rx="6" fill="#00F2FE" fill-opacity="0.15" stroke="#00F2FE" stroke-width="1" />
    <text x="197" y="43" text-anchor="middle" fill="#93C5FD" font-family="system-ui, sans-serif" font-weight="800" font-size="13" letter-spacing="0.5">MODERN: ZERO-TRUST MODEL</text>

    <!-- Branch Office Object -->
    <g transform="translate(70, 130)">
      <rect x="-45" y="-35" width="90" height="70" rx="8" fill="#0B1626" stroke="#00F2FE" stroke-width="2" />
      <circle cx="0" cy="-10" r="12" fill="#00F2FE" fill-opacity="0.2" />
      <path d="M -5 -3 L -2 -7 L 5 -13" stroke="#00F2FE" stroke-width="3" stroke-linecap="round" fill="none" />
      <text x="0" y="22" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="700" font-size="11">Branch</text>
    </g>

    <!-- Cloud Server Object -->
    <g transform="translate(325, 130)">
      <rect x="-45" y="-35" width="90" height="70" rx="8" fill="#0B1626" stroke="#00F2FE" stroke-width="2" />
      <path d="M -15 -6 C -21 -6 -25 -11 -25 -16 C -25 -21 -21 -25 -15 -25 C -14 -25 -13 -25 -11 -24 C -9 -29 -4 -32 2 -30 C 8 -28 11 -23 11 -18 C 15 -18 18 -15 18 -11 C 18 -6 15 -3 11 -3 Z" fill="url(#cyanGrad)" opacity="0.9" transform="translate(0, 5) scale(1.1)" />
      <text x="0" y="22" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="700" font-size="11">Cloud Server</text>
    </g>

    <!-- Secure Encrypted Tunnel (Mesh VPN) -->
    <path d="M 115 130 Q 197 80 280 130" stroke="#00F2FE" stroke-width="3.5" fill="none" filter="url(#cyanGlow)" />
    <path d="M 115 130 Q 197 180 280 130" stroke="#4FACFE" stroke-width="2" stroke-dasharray="5 3" fill="none" opacity="0.8" />

    <!-- Secure Edge Gateway Object in Middle -->
    <g transform="translate(197, 130)">
      <rect x="-32" y="-22" width="64" height="44" rx="6" fill="#0B1626" stroke="#00F2FE" stroke-width="2" filter="url(#cyanGlow)" />
      <circle cx="0" cy="0" r="10" fill="#00F2FE" fill-opacity="0.3" />
      <path d="M -4 -2 L 0 3 L 4 -2" stroke="#00F2FE" stroke-width="2" stroke-linecap="round" fill="none" />
    </g>

    <!-- Key Advantages (Text List) -->
    <g transform="translate(25, 200)">
      <circle cx="12" cy="12" r="5" fill="#00F2FE" />
      <text x="28" y="16" fill="#F3F4F6" font-family="system-ui, sans-serif" font-weight="700" font-size="11">Zero Public IPs (Invisible to Internet)</text>
      
      <circle cx="12" cy="48" r="5" fill="#00F2FE" />
      <text x="28" y="52" fill="#F3F4F6" font-family="system-ui, sans-serif" font-weight="700" font-size="11">End-to-End Encrypted Tunnels (Tailscale)</text>

      <circle cx="12" cy="84" r="5" fill="#00F2FE" />
      <text x="28" y="88" fill="#F3F4F6" font-family="system-ui, sans-serif" font-weight="700" font-size="11">Strict Identity Verification &amp; OIDC RBAC</text>
    </g>

    <!-- Bottom Status Badge -->
    <rect x="25" y="355" width="345" height="36" rx="6" fill="#00F2FE" fill-opacity="0.1" stroke="#00F2FE" stroke-width="1" />
    <text x="197" y="378" text-anchor="middle" fill="#67E8F9" font-family="system-ui, sans-serif" font-weight="800" font-size="11" letter-spacing="0.5">STATUS: SECURE MESH TUNNEL</text>
  </g>
</svg>