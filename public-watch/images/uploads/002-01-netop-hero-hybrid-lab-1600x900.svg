<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" style="background-color: #0B132B;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070D1B" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#1C2541" />
    </linearGradient>

    <!-- Node Gradient (Azure / Cloud) -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <!-- Node Gradient (On-Prem / Firewall) -->
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172A45" />
      <stop offset="100%" stop-color="#303C55" />
    </linearGradient>

    <!-- Cyan Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1E293B" stroke-width="1" stroke-opacity="0.6" />
      <circle cx="60" cy="60" r="1" fill="#00F2FE" fill-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bgGrad)" />
  <rect width="1600" height="900" fill="url(#techGrid)" />

  <!-- Ambient Light Blobs -->
  <circle cx="800" cy="450" r="300" fill="#00F2FE" fill-opacity="0.04" filter="url(#softGlow)" />
  <circle cx="250" cy="250" r="200" fill="#4FACFE" fill-opacity="0.03" filter="url(#softGlow)" />
  <circle cx="1350" cy="650" r="200" fill="#00F2FE" fill-opacity="0.03" filter="url(#softGlow)" />

  <!-- ==================== NETWORK CONNECTIONS (MESH VPN) ==================== -->
  <g stroke="#00F2FE" stroke-width="2.5" stroke-dasharray="8 6" fill="none" opacity="0.6">
    <path d="M 800 420 L 350 240" />
    <path d="M 800 420 L 350 660" />
    <path d="M 800 420 L 1250 240" />
    <path d="M 800 420 L 1250 660" />
    
    <path d="M 350 240 L 350 660" stroke-dasharray="4 4" stroke-opacity="0.3" />
    <path d="M 1250 240 L 1250 660" stroke-dasharray="4 4" stroke-opacity="0.3" />
    <path d="M 350 240 L 1250 240" stroke-dasharray="4 4" stroke-opacity="0.3" />
    <path d="M 350 660 L 1250 660" stroke-dasharray="4 4" stroke-opacity="0.3" />
  </g>

  <!-- Data Packets -->
  <g fill="#00F2FE" filter="url(#cyanGlow)">
    <circle cx="575" cy="330" r="6" />
    <circle cx="575" cy="540" r="6" />
    <circle cx="1025" cy="330" r="6" />
    <circle cx="1025" cy="540" r="6" />
  </g>

  <!-- ==================== CENTRAL AZURE CLOUD NODE ==================== -->
  <g transform="translate(800, 420)">
    <circle cx="0" cy="0" r="110" fill="none" stroke="#00F2FE" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6 6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite" />
    </circle>
    
    <circle cx="0" cy="0" r="85" fill="#070D1B" stroke="#00F2FE" stroke-width="2" filter="url(#cyanGlow)" />

    <path d="M -25 10 C -38 10 -48 0 -48 -13 C -48 -26 -38 -36 -25 -36 C -23 -36 -20 -35 -18 -34 C -13 -44 -3 -48 8 -44 C 18 -40 24 -30 24 -20 C 32 -20 38 -14 38 -6 C 38 2 32 8 24 8 Z" fill="url(#cloudGrad)" opacity="0.9" transform="translate(0, 5) scale(1.2)" />

    <!-- Text phóng to -->
    <text x="0" y="80" text-anchor="middle" fill="#00F2FE" font-family="system-ui, sans-serif" font-weight="700" font-size="18" letter-spacing="2">AZURE CLOUD NODE</text>
    <text x="0" y="102" text-anchor="middle" fill="#8892B0" font-family="system-ui, sans-serif" font-weight="500" font-size="14" letter-spacing="1">Central Gateway &amp; Hub</text>
  </g>

  <!-- ==================== ON-PREMISE BRANCH NETWORK (TOP LEFT) ==================== -->
  <g transform="translate(350, 240)">
    <rect x="-95" y="-60" width="190" height="120" rx="12" fill="url(#nodeGrad)" stroke="#00F2FE" stroke-width="1.5" filter="url(#cyanGlow)" />
    <g transform="translate(0, -22)" stroke="#00F2FE" stroke-width="2" fill="none">
      <rect x="-25" y="-12" width="50" height="24" rx="4" fill="#0B132B" />
      <circle cx="-15" cy="0" r="3" fill="#00F2FE" />
      <line x1="-5" y1="0" x2="15" y2="0" stroke-linecap="round" />
    </g>
    <!-- Text phóng to -->
    <text x="0" y="24" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, sans-serif" font-weight="700" font-size="16">Branch Office 01</text>
    <text x="0" y="44" text-anchor="middle" fill="#00F2FE" font-family="system-ui, sans-serif" font-weight="600" font-size="13">Tailscale Edge Node</text>
  </g>

  <!-- ==================== ON-PREMISE BRANCH NETWORK (BOTTOM LEFT) ==================== -->
  <g transform="translate(350, 660)">
    <rect x="-95" y="-60" width="190" height="120" rx="12" fill="url(#nodeGrad)" stroke="#303C55" stroke-width="1.5" />
    <g transform="translate(0, -22)" stroke="#4FACFE" stroke-width="2" fill="none">
      <path d="M -20 -10 L 0 -20 L 20 -10 L 20 10 L 0 20 L -20 10 Z" fill="#0B132B" />
      <line x1="-10" y1="0" x2="10" y2="0" />
      <line x1="0" y1="-10" x2="0" y2="10" />
    </g>
    <!-- Text phóng to -->
    <text x="0" y="24" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, sans-serif" font-weight="700" font-size="16">Branch Office 02</text>
    <text x="0" y="44" text-anchor="middle" fill="#8892B0" font-family="system-ui, sans-serif" font-weight="500" font-size="13">NGFW &amp; Local Subnet</text>
  </g>

  <!-- ==================== ON-PREMISE BRANCH NETWORK (TOP RIGHT) ==================== -->
  <g transform="translate(1250, 240)">
    <rect x="-95" y="-60" width="190" height="120" rx="12" fill="url(#nodeGrad)" stroke="#303C55" stroke-width="1.5" />
    <g transform="translate(0, -22)" stroke="#4FACFE" stroke-width="2" fill="none">
      <rect x="-22" y="-14" width="44" height="10" rx="2" fill="#0B132B" />
      <rect x="-22" y="2" width="44" height="10" rx="2" fill="#0B132B" />
      <circle cx="-13" cy="-9" r="1.5" fill="#4FACFE" />
      <circle cx="-13" cy="7" r="1.5" fill="#4FACFE" />
    </g>
    <!-- Text phóng to -->
    <text x="0" y="24" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, sans-serif" font-weight="700" font-size="16">Enterprise Store</text>
    <text x="0" y="44" text-anchor="middle" fill="#8892B0" font-family="system-ui, sans-serif" font-weight="500" font-size="13">POS &amp; Local Gateway</text>
  </g>

  <!-- ==================== ON-PREMISE BRANCH NETWORK (BOTTOM RIGHT) ==================== -->
  <g transform="translate(1250, 660)">
    <rect x="-95" y="-60" width="190" height="120" rx="12" fill="url(#nodeGrad)" stroke="#00F2FE" stroke-width="1.5" filter="url(#cyanGlow)" />
    <g transform="translate(0, -22)" stroke="#00F2FE" stroke-width="2" fill="none">
      <path d="M 0 -18 L 16 -8 L 16 6 C 16 14 8 18 0 22 C -8 18 -16 14 -16 6 L -16 -8 Z" fill="#0B132B" />
      <polyline points="-5,0 -1,4 6,-3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <!-- Text phóng to -->
    <text x="0" y="24" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, sans-serif" font-weight="700" font-size="16">HQ Data Center</text>
    <text x="0" y="44" text-anchor="middle" fill="#00F2FE" font-family="system-ui, sans-serif" font-weight="600" font-size="13">Zero-Trust Enforced</text>
  </g>

  <!-- ==================== FLOATING BADGES & ACCENTS ==================== -->
  <g transform="translate(800, 150)">
    <rect x="-135" y="-20" width="270" height="40" rx="20" fill="#172A45" stroke="#00F2FE" stroke-width="1.2" fill-opacity="0.9" />
    <circle cx="-105" cy="0" r="6" fill="#00F2FE" />
    <text x="-85" y="6" fill="#E2E8F0" font-family="system-ui, sans-serif" font-weight="700" font-size="14" letter-spacing="1">TAILSCALE MESH VPN</text>
  </g>

  <g transform="translate(200, 450)">
    <rect x="-80" y="-18" width="160" height="36" rx="8" fill="#111B2E" stroke="#1E293B" stroke-width="1" />
    <text x="0" y="5" text-anchor="middle" fill="#8892B0" font-family="system-ui, sans-serif" font-weight="600" font-size="12" letter-spacing="1.5">ENC: AES-256</text>
  </g>

  <g transform="translate(1400, 450)">
    <rect x="-80" y="-18" width="160" height="36" rx="8" fill="#111B2E" stroke="#1E293B" stroke-width="1" />
    <text x="0" y="5" text-anchor="middle" fill="#8892B0" font-family="system-ui, sans-serif" font-weight="600" font-size="12" letter-spacing="1.5">ZERO-TRUST OIDC</text>
  </g>

  <g stroke="#00F2FE" stroke-width="2" fill="none" opacity="0.4">
    <path d="M 40 60 L 40 40 L 60 40" />
    <path d="M 1560 60 L 1560 40 L 1540 40" />
    <path d="M 40 840 L 40 860 L 60 860" />
    <path d="M 1560 840 L 1560 860 L 1540 860" />
  </g>
</svg>