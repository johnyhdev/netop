<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 481" width="856" height="481">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#07111e" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <!-- Green Glowing Gradient (Provided Features) -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff87" />
      <stop offset="100%" stop-color="#60efff" />
    </linearGradient>

    <!-- Amber Glowing Gradient (Internal Risks) -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#fb8500" />
    </linearGradient>

    <!-- Cyan Glowing Gradient (Enterprise Note) -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#00f2fe" flood-opacity="0.15" />
    </filter>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- BACKGROUND -->
  <rect width="856" height="481" fill="url(#bgGrad)" />

  <!-- GRID BACKGROUND PATTERN -->
  <g opacity="0.05" stroke="#00f2fe" stroke-width="1">
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" />
    </pattern>
    <rect width="856" height="481" fill="url(#grid)" />
  </g>

  <!-- TOP TITLE HEADER -->
  <g filter="url(#glow)">
    <text x="428" y="48" font-family="&#39;Courier New&#39;, monospace" font-weight="900" font-size="24" fill="#60efff" text-anchor="middle" letter-spacing="1.5">PRAGMATIC ENGINEERING DISCLAIMER</text>
    <text x="428" y="74" font-family="&#39;Courier New&#39;, monospace" font-weight="bold" font-size="15" fill="#00ff87" text-anchor="middle" letter-spacing="0.5">Open Source Transparency &amp; Production Hardening</text>
  </g>

  <!-- ================= LEFT BOX: CODE BASELINE PROVIDED (GREEN) ================= -->
  <g filter="url(#shadow)">
    <!-- Main Box -->
    <rect x="48" y="105" width="365" height="175" rx="12" fill="#041217" stroke="#00ff87" stroke-width="4" />
    <path d="M 300 105 L 340 105 L 350 115 L 380 115" stroke="#00ff87" stroke-width="2" fill="none" opacity="0.6" />

    <!-- Box Header -->
    <text x="230.5" y="138" font-family="&#39;Courier New&#39;, monospace" font-weight="900" font-size="16" fill="#00ff87" text-anchor="middle">CODE BASELINE PROVIDED</text>

    <!-- Lock Icon (SVG Vector) -->
    <g transform="translate(70, 160)" stroke="#00ff87" stroke-width="3" fill="none">
      <rect x="5" y="20" width="36" height="28" rx="5" />
      <path d="M 13 20 V 12 A 10 10 0 0 1 33 12 V 20" />
      <circle cx="23" cy="32" r="3" fill="#00ff87" />
      <!-- Checkmark -->
      <circle cx="36" cy="40" r="9" fill="#041217" stroke="#00ff87" stroke-width="2" />
      <path d="M 31 40 L 35 44 L 41 36" stroke="#00ff87" stroke-width="2" />
    </g>

    <!-- Description Text -->
    <text x="260" y="175" font-family="&#39;Segoe UI&#39;, sans-serif" font-weight="bold" font-size="16" fill="#ffffff" text-anchor="middle">Robust Automation</text>
    <text x="260" y="200" font-family="&#39;Segoe UI&#39;, sans-serif" font-weight="bold" font-size="16" fill="#ffffff" text-anchor="middle">Secure Perimeter</text>
    <text x="260" y="222" font-family="&#39;Segoe UI&#39;, sans-serif" font-weight="bold" font-size="15" fill="#60efff" text-anchor="middle">(No Public IPs)</text>

    <!-- Cloud No-IP Icon -->
    <g transform="translate(325, 175)" stroke="#60efff" stroke-width="2" fill="none" opacity="0.8">
      <path d="M 10 25 A 12 12 0 0 1 30 15 A 14 14 0 0 1 50 25 A 10 10 0 0 1 45 40 L 12 40 A 10 10 0 0 1 10 25 Z" />
      <text x="16" y="32" font-family="sans-serif" font-size="8" font-weight="bold" fill="#60efff" stroke="none">IPs</text>
      <line x1="12" y1="18" x2="44" y2="38" stroke="#ff5f56" stroke-width="3" />
    </g>
  </g>

  <!-- ================= RIGHT BOX: INTERNAL RISKS PERSIST (AMBER) ================= -->
  <g filter="url(#shadow)">
    <!-- Main Box -->
    <rect x="443" y="105" width="365" height="175" rx="12" fill="#171004" stroke="#ffb703" stroke-width="4" />
    
    <!-- Box Header -->
    <text x="625.5" y="138" font-family="&#39;Courier New&#39;, monospace" font-weight="900" font-size="16" fill="#ffb703" text-anchor="middle">INTERNAL RISKS PERSIST</text>

    <!-- Wall / Vulnerability Icon -->
    <g transform="translate(463, 160)" stroke="#ffb703" stroke-width="2" fill="none">
      <rect x="0" y="0" width="48" height="40" rx="3" />
      <line x1="0" y1="13" x2="48" y2="13" />
      <line x1="0" y1="26" x2="48" y2="26" />
      <line x1="24" y1="0" x2="24" y2="13" />
      <line x1="12" y1="13" x2="12" y2="26" />
      <line x1="36" y1="13" x2="36" y2="26" />
      <line x1="24" y1="26" x2="24" y2="40" />
      <!-- Crack -->
      <path d="M 20 0 L 26 15 L 18 28 L 24 40" stroke="#ff5f56" stroke-width="3" />
    </g>

    <!-- Text Content -->
    <text x="640" y="175" font-family="&#39;Segoe UI&#39;, sans-serif" font-weight="bold" font-size="16" fill="#ffffff" text-anchor="middle">App Vulnerabilities</text>
    <text x="640" y="200" font-family="&#39;Segoe UI&#39;, sans-serif" font-weight="bold" font-size="16" fill="#ffffff" text-anchor="middle">Privilege Escalation</text>

    <!-- Escalation Icon -->
    <g transform="translate(735, 160)" stroke="#ffb703" stroke-width="2" fill="none">
      <path d="M 5 35 L 18 25 L 28 30 L 42 10" stroke-width="3" />
      <path d="M 32 10 L 42 10 L 42 20" stroke-width="3" />
      <circle cx="10" cy="15" r="4" />
      <path d="M 10 19 V 28 M 6 23 H 14" />
    </g>

    <!-- Warning Footer Banner inside Right Box -->
    <rect x="458" y="222" width="335" height="42" rx="6" fill="#2a1702" stroke="#fb8500" stroke-width="1.5" />
    <text x="625.5" y="248" font-family="&#39;Courier New&#39;, monospace" font-weight="bold" font-size="13" fill="#ffb703" text-anchor="middle">Eliminating Public Exposure != No Internal Risks</text>
  </g>

  <!-- CONNECTING PIPES / LINES -->
  <path d="M 230.5 280 V 315 H 300" stroke="#00ff87" stroke-width="3" fill="none" opacity="0.6" />
  <path d="M 625.5 280 V 315 H 556" stroke="#ffb703" stroke-width="3" fill="none" opacity="0.6" />

  <!-- ================= BOTTOM BOX: ENTERPRISE DEPLOYMENT NOTE (CYAN) ================= -->
  <g filter="url(#shadow)">
    <!-- Main Bottom Box -->
    <rect x="180" y="315" width="496" height="135" rx="12" fill="#040f1a" stroke="#00f2fe" stroke-width="4" />

    <!-- Header -->
    <text x="428" y="343" font-family="&#39;Courier New&#39;, monospace" font-weight="900" font-size="16" fill="#00f2fe" text-anchor="middle" letter-spacing="0.5">ENTERPRISE DEPLOYMENT NOTE</text>

    <!-- Checklist Icon -->
    <g transform="translate(205, 350)" stroke="#4facfe" stroke-width="2" fill="none">
      <rect x="0" y="0" width="50" height="65" rx="5" fill="#081b2e" />
      <!-- Clip top -->
      <rect x="15" y="-5" width="20" height="8" rx="2" fill="#4facfe" />
      <!-- Lines & Checks -->
      <path d="M 10 20 L 16 26 L 26 16" stroke="#00ff87" stroke-width="2.5" />
      <line x1="30" y1="22" x2="42" y2="22" />
      <path d="M 10 38 L 16 44 L 26 34" stroke="#00ff87" stroke-width="2.5" />
      <line x1="30" y1="40" x2="42" y2="40" />
      <!-- Gear -->
      <circle cx="40" cy="52" r="7" stroke="#00f2fe" stroke-width="2" />
    </g>

    <!-- Bullet Points -->
    <g font-family="&#39;Segoe UI&#39;, sans-serif" font-size="14" fill="#ffffff">
      <!-- Bullet 1 -->
      <circle cx="275" cy="368" r="3" fill="#00f2fe" />
      <text x="287" y="373" font-weight="600">Specialized Internal Auditing</text>

      <!-- Bullet 2 -->
      <circle cx="275" cy="390" r="3" fill="#00f2fe" />
      <text x="287" y="395" font-weight="600">HA Configuration &amp; Tailored Redundancy</text>

      <!-- Bullet 3 -->
      <circle cx="275" cy="412" r="3" fill="#00f2fe" />
      <text x="287" y="417" font-weight="600">Use as Accelerators</text>
    </g>

    <!-- Highlighted Warning Footer -->
    <text x="428" y="438" font-family="&#39;Courier New&#39;, monospace" font-weight="bold" font-size="13" fill="#ffbd2e" text-anchor="middle">** SECURITY REVIEWS BEFORE PRODUCTION **</text>
  </g>

  <!-- DECORATIVE ACCENTS -->
  <g opacity="0.4" fill="#00f2fe">
    <polygon points="780,440 795,445 785,455" />
    <circle cx="80" cy="440" r="3" />
    <circle cx="95" cy="440" r="3" />
  </g>
</svg>