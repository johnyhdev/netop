<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d11" />
    </radialGradient>

    <!-- Card Gradients -->
    <linearGradient id="azure-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f293d" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="github-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d1f3d" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="tailscale-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#30363d" stroke-width="0.5" stroke-dasharray="2,4" opacity="0.3" />
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="1600" height="900" fill="url(#bg-glow)" />
  <rect width="1600" height="900" fill="url(#grid)" />

  <!-- TOP HEADER -->
  <g transform="translate(80, 80)">
    <text x="0" y="0" font-size="14" font-weight="700" fill="#38bdf8" letter-spacing="3">NETOP LAB ARCHITECTURE BLUEPRINT</text>
    <text x="0" y="40" font-size="32" font-weight="800" fill="#f3f4f6">Zero-Trust Hybrid Infrastructure Lab</text>
    <text x="0" y="70" font-size="16" font-weight="400" fill="#9ca3af">Bridging Azure Cloud with Automated Configuration, GitHub OIDC &amp; Tailscale Private Mesh</text>
  </g>

  <!-- CENTRAL CONNECTIVITY MESH LAYER (TAILSCALE ENCRYPTED BACKBONE) -->
  <g transform="translate(100, 220)">
    <rect x="0" y="0" width="1400" height="580" rx="16" fill="url(#tailscale-card)" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.7" />
    <rect x="20" y="20" width="220" height="34" rx="6" fill="#1e40af" opacity="0.8" />
    <text x="35" y="42" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="1">🔒 TAILSCALE MESH VPN (ZTNA)</text>
  </g>

  <!-- ==================== LEFT REGION: GITHUB ACTIONS CI/CD ==================== -->
  <g transform="translate(140, 290)">
    <!-- Main GitHub Box -->
    <rect x="0" y="0" width="380" height="470" rx="12" fill="url(#github-card)" stroke="#8b5cf6" stroke-width="2" filter="url(#glow-purple)" />
    
    <!-- Title & Icon -->
    <path d="M 35 40 A 15 15 0 0 1 35 70 A 15 15 0 0 1 35 40 Z" fill="#a855f7" opacity="0.2" />
    <text x="35" y="45" font-size="20" font-weight="700" fill="#c084fc">GitHub Actions CI/CD</text>
    <text x="35" y="68" font-size="13" font-weight="400" fill="#9ca3af">Single Source of Truth (GitOps)</text>

    <!-- Sub Component: OIDC Identity Provider -->
    <g transform="translate(25, 100)">
      <rect x="0" y="0" width="330" height="90" rx="8" fill="#171123" stroke="#a855f7" stroke-width="1" />
      <text x="20" y="32" font-size="14" font-weight="700" fill="#e9d5ff">🔑 OpenID Connect (OIDC)</text>
      <text x="20" y="55" font-size="12" fill="#a7f3d0">✔ Keyless Authentication</text>
      <text x="20" y="72" font-size="12" fill="#94a3b8">Short-lived Federated Tokens</text>
    </g>

    <!-- Sub Component: Automation Tooling -->
    <g transform="translate(25, 210)">
      <rect x="0" y="0" width="330" height="110" rx="8" fill="#171123" stroke="#4c1d95" stroke-width="1" />
      <text x="20" y="30" font-size="14" font-weight="700" fill="#ddd6fe">⚙️ IaC &amp; Configuration</text>
      
      <!-- Badges -->
      <rect x="20" y="48" width="130" height="26" rx="4" fill="#84cc16" opacity="0.2" stroke="#84cc16" stroke-width="1" />
      <text x="35" y="65" font-size="12" font-weight="700" fill="#a3e635">Terraform IaC</text>

      <rect x="160" y="48" width="140" height="26" rx="4" fill="#ef4444" opacity="0.2" stroke="#ef4444" stroke-width="1" />
      <text x="175" y="65" font-size="12" font-weight="700" fill="#fca5a5">Ansible Playbooks</text>

      <text x="20" y="94" font-size="11" fill="#64748b">PR Approval Gates &amp; Branch Rules</text>
    </g>

    <!-- Sub Component: Runner Badge -->
    <g transform="translate(25, 340)">
      <rect x="0" y="0" width="330" height="100" rx="8" fill="#171123" stroke="#334155" stroke-width="1" />
      <text x="20" y="30" font-size="13" font-weight="700" fill="#cbd5e1">🤖 GitHub Runner Node</text>
      <text x="20" y="52" font-size="12" fill="#38bdf8">• Tagged: tag:ci</text>
      <text x="20" y="72" font-size="12" fill="#38bdf8">• Dynamic Tailscale Ephemeral Join</text>
      <text x="20" y="88" font-size="11" fill="#64748b">No SSH Keys Stored in GitHub Secrets</text>
    </g>
  </g>

  <!-- ==================== RIGHT REGION: AZURE CLOUD (ZERO TRUST) ==================== -->
  <g transform="translate(680, 290)">
    <!-- Main Azure Box -->
    <rect x="0" y="0" width="780" height="470" rx="12" fill="url(#azure-card)" stroke="#0284c7" stroke-width="2" filter="url(#glow-cyan)" />
    
    <!-- Title & Cloud Badge -->
    <text x="35" y="45" font-size="20" font-weight="700" fill="#38bdf8">Microsoft Azure Infrastructure</text>
    <text x="35" y="68" font-size="13" font-weight="400" fill="#9ca3af">Resource Group: rg-hybrid-infra-lab (Central India)</text>

    <!-- ZERO PUBLIC IP BADGE -->
    <g transform="translate(530, 25)">
      <rect x="0" y="0" width="215" height="36" rx="18" fill="#dc2626" opacity="0.2" stroke="#ef4444" stroke-width="1.5" />
      <circle cx="20" cy="18" r="6" fill="#ef4444" />
      <text x="35" y="23" font-size="13" font-weight="800" fill="#fca5a5" letter-spacing="0.5">0 PUBLIC IP EXPOSURE</text>
    </g>

    <!-- Subnet 1: Automation Subnet -->
    <g transform="translate(35, 100)">
      <rect x="0" y="0" width="340" height="340" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="4,4" />
      <text x="20" y="30" font-size="14" font-weight="700" fill="#7dd3fc">snet-automation (10.20.1.0/24)</text>

      <!-- VM Node: Control Manager -->
      <g transform="translate(20, 50)">
        <rect x="0" y="0" width="300" height="260" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
        <rect x="15" y="15" width="80" height="22" rx="4" fill="#0284c7" />
        <text x="23" y="30" font-size="10" font-weight="800" fill="#ffffff">TAG: CM</text>

        <text x="105" y="31" font-size="15" font-weight="700" fill="#f8fafc">vm-cm-01</text>
        <text x="15" y="60" font-size="12" fill="#94a3b8">OS: Ubuntu 24.04 ARM64</text>
        <text x="15" y="78" font-size="12" fill="#94a3b8">Size: Standard_D2ps_v6</text>
        
        <path d="M 15 95 L 280 95" stroke="#334155" stroke-width="1" />

        <text x="15" y="118" font-size="12" font-weight="700" fill="#38bdf8">Key Services Installed:</text>
        <text x="15" y="140" font-size="12" fill="#cbd5e1">✔ Tailscale Subnet Router</text>
        <text x="15" y="160" font-size="12" fill="#cbd5e1">✔ Tailscale SSH Daemon</text>
        <text x="15" y="180" font-size="12" fill="#cbd5e1">✔ Azure Managed Identity (id-cm)</text>
        <text x="15" y="200" font-size="12" fill="#cbd5e1">✔ Ansible Execution Node</text>

        <rect x="15" y="218" width="270" height="26" rx="4" fill="#0f172a" stroke="#22c55e" stroke-width="1" />
        <text x="25" y="235" font-size="11" font-weight="700" fill="#4ade80">Priv IP: 10.20.1.4 (No Public IP)</text>
      </g>
    </g>

    <!-- Subnet 2: Workload Subnet -->
    <g transform="translate(405, 100)">
      <rect x="0" y="0" width="340" height="340" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1" stroke-dasharray="4,4" />
      <text x="20" y="30" font-size="14" font-weight="700" fill="#6ee7b7">snet-workload (10.20.2.0/24)</text>

      <!-- VM Node: Workload -->
      <g transform="translate(20, 50)">
        <rect x="0" y="0" width="300" height="260" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
        <rect x="15" y="15" width="110" height="22" rx="4" fill="#059669" />
        <text x="23" y="30" font-size="10" font-weight="800" fill="#ffffff">TAG: WORKLOAD</text>

        <text x="135" y="31" font-size="15" font-weight="700" fill="#f8fafc">vm-workload-01</text>
        <text x="15" y="60" font-size="12" fill="#94a3b8">OS: Ubuntu 24.04 ARM64</text>
        <text x="15" y="78" font-size="12" fill="#94a3b8">Provisioned via Ansible Over Private VNet</text>
        
        <path d="M 15 95 L 280 95" stroke="#334155" stroke-width="1" />

        <text x="15" y="118" font-size="12" font-weight="700" fill="#34d399">Application Baseline:</text>
        <text x="15" y="140" font-size="12" fill="#cbd5e1">✔ Nginx Reverse Proxy (Port 80)</text>
        <text x="15" y="160" font-size="12" fill="#cbd5e1">✔ Python Demo App (Port 8080)</text>
        <text x="15" y="180" font-size="12" fill="#cbd5e1">✔ Node Exporter (Port 9100)</text>
        <text x="15" y="200" font-size="12" fill="#cbd5e1">✔ PostgreSQL Scaffolding</text>

        <rect x="15" y="218" width="270" height="26" rx="4" fill="#0f172a" stroke="#22c55e" stroke-width="1" />
        <text x="25" y="235" font-size="11" font-weight="700" fill="#4ade80">Priv IP: 10.20.2.4 (No Public IP)</text>
      </g>
    </g>
  </g>

  <!-- ==================== FLOW CONNECTORS & ARROWS ==================== -->
  
  <!-- Flow 1: OIDC Authentication (GitHub -> Azure Entra ID) -->
  <path d="M 520 390 L 680 390" stroke="#c084fc" stroke-width="3" stroke-dasharray="6,6" marker-end="url(#arrow-purple)" />
  <rect x="545" y="365" width="110" height="22" rx="4" fill="#2e1065" stroke="#a855f7" stroke-width="1" />
  <text x="553" y="380" font-size="10" font-weight="700" fill="#e9d5ff">1. OIDC WIF TOKEN</text>

  <!-- Flow 2: Tailscale CI Access to CM -->
  <path d="M 520 630 L 720 630" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4,4" filter="url(#glow-cyan)" />
  <rect x="540" y="605" width="140" height="22" rx="4" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1" />
  <text x="548" y="620" font-size="10" font-weight="700" fill="#38bdf8">2. TAILSCALE SSH ACCESS</text>

  <!-- Flow 3: Internal Ansible Deployment (CM -> Workload) -->
  <path d="M 1040 520 L 1105 520" stroke="#4ade80" stroke-width="3" stroke-dasharray="4,4" filter="url(#glow-green)" />
  <polygon points="1100,515 1112,520 1100,525" fill="#4ade80" />
  <rect x="1042" y="490" width="60" height="20" rx="3" fill="#14532d" />
  <text x="1047" y="504" font-size="9" font-weight="700" fill="#86efac">ANSIBLE</text>

  <!-- FOOTER SLA & SECURITY STATEMENT -->
  <g transform="translate(80, 840)">
    <rect x="0" y="0" width="1440" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="20" y="25" font-size="12" font-weight="600" fill="#9ca3af">🔒 SECURITY POLICY:</text>
    <text x="150" y="25" font-size="12" fill="#6b7280">Zero Public IP • GitHub Single Source of Truth • Strict RBAC Scoping • Ephemeral CI Authentication • Tailscale Policy-as-Code (HUJSON)</text>
    <text x="1300" y="25" font-size="12" font-weight="700" fill="#38bdf8">netop.uk</text>
  </g>
</svg>